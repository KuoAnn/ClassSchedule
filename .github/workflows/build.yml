name: build

# 推到 main 就重新產檔、跑四項檢查，通過後發佈到 GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只允許一個發佈進行中；排隊中的舊 run 直接跳過，但不打斷正在跑的發佈
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 產檔
        # LIFF_ID 設在 repo 的 Variables（Settings → Secrets and variables → Actions → Variables）
        # 沒設也不會壞：09-liff.js 只是不初始化 LINE SDK，課表照樣顯示
        env:
          LIFF_ID: ${{ vars.LIFF_ID }}
        run: python scripts/build.py

      # 四張下載圖（寬／窄 × 中／英）。用 playwright 真的開一次頁面畫，
      # 所以要排在產檔之後、發佈之前；前端不再有 html2canvas
      - name: 產下載圖
        run: python scripts/shots.py

      - name: 遮蔽檢查
        run: python scripts/checks/occl.py

      - name: 對比度 寬版
        run: python scripts/checks/wcag.py

      - name: 對比度 窄版
        run: python scripts/checks/wcag.py 375

      - name: 色票對應
        run: python scripts/checks/catcheck.py

      - name: 固定時間再跑一次（驗「今天」與「已結束」狀態）
        env:
          FAKE_CLOCK: "1"
        run: |
          python scripts/checks/occl.py
          python scripts/checks/wcag.py 375

      - name: 首頁指向最新課表
        run: cp "$(ls -t dist/*.html | head -n 1)" dist/index.html

      # HTML 與四張 PNG 一起帶走：PNG 是「下載課表圖片」按鈕實際導過去的檔案，
      # 少了它們 Pages 上按下載就是 404
      - name: 保留產物（單一 HTML ＋ 四張下載圖）
        uses: actions/upload-artifact@v4
        with:
          name: schedule-site
          path: |
            dist/*.html
            dist/*.png
          if-no-files-found: error

  # 發佈獨立成一個 job：Pages 沒開或沒權限時，上面的產檔與四項檢查結果不會被連坐
  pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 取回 build 產物
        uses: actions/download-artifact@v4
        with:
          name: schedule-site
          path: dist

      # Pages 必須先在 repo 上啟用一次，否則這步會死在
      #   Get Pages site failed ... Not Found
      # 啟用方式：Settings → Pages → Source 選 GitHub Actions，或
      #   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
      # enablement: true 只是保險 — 站已存在時它單純讀設定；真的要建站會被
      # GITHUB_TOKEN 拒絕（Resource not accessible by integration），不能只靠它
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
