name: build

# 推到 main 就重新產檔、跑四項檢查，通過後發佈到 GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只允許一個發佈進行中；排隊中的舊 run 直接跳過，但不打斷正在跑的發佈
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 產檔
        run: python scripts/build.py

      - name: 遮蔽檢查
        run: python scripts/checks/occl.py

      - name: 對比度 寬版
        run: python scripts/checks/wcag.py

      - name: 對比度 窄版
        run: python scripts/checks/wcag.py 375

      - name: 色票對應
        run: python scripts/checks/catcheck.py

      - name: 固定時間再跑一次（驗「今天」與「已結束」狀態）
        env:
          FAKE_CLOCK: "1"
        run: |
          python scripts/checks/occl.py
          python scripts/checks/wcag.py 375

      - name: 首頁指向最新課表
        run: cp "$(ls -t dist/*.html | head -n 1)" dist/index.html

      - name: 保留產物（可直接下載單一 HTML）
        uses: actions/upload-artifact@v4
        with:
          name: schedule-html
          path: dist/*.html
          if-no-files-found: error

  # 發佈獨立成一個 job：Pages 沒開或沒權限時，上面的產檔與四項檢查結果不會被連坐
  pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 取回 build 產物
        uses: actions/download-artifact@v4
        with:
          name: schedule-html
          path: dist

      # enablement: true 會在 repo 還沒開 Pages 時自己開起來並設成 GitHub Actions 來源，
      # 少了它第一次跑會死在 "Get Pages site failed ... Not Found"
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
